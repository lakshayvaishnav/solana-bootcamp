# .rustfmt.toml
# Rustfmt configuration tailored for Anchor/Solana programs

edition = "2021"                    # Use Rust 2021 edition rules
max_width = 150                     # Wrap lines at 100 chars for readability
tab_spaces = 4                      # Use 4 spaces per indent (common in Solana/Anchor)
hard_tabs = false                   # Use spaces instead of tabs
indent_style = "Block"              # Standard block‐style indentation

# Don’t reorder imports––Anchor/SPL imports often have a specific order
reorder_imports = false
# merge_imports = true                # But merge multiple imports from the same crate
group_imports = "StdExternalCrate"  # Group imports: std → external crates → workspace
imports_granularity = "Crate"       # Prefer `use foo::*;` over many individual imports

# Macro/layout formatting
layout_macro_invocations = true     # Keep #[program], #[derive], etc. tidy
format_macro_matchers = true        # Clean up `macro_rules!` matchers

# Doc comments & code blocks
format_code_in_doc_comments = true  # Auto‐format code examples in your docs

# Struct/enum layout
struct_lit_multiline_style = "Block"    # Force block style for long struct literals
struct_field_align_threshold = 20       # Align fields if fewer than 20
enum_discrim_align_threshold = 0        # Don’t align enum discriminants

# Brace placement
brace_style = "AlwaysNextLine"      # Put `{` on the next line for functions/types
